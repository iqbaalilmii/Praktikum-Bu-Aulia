<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Tabel HTML</title>
</head>
<body>
    <h1>Contoh Tabel HTML</h1>

    <h2>Struktur dasar tabel</h2>
    <table border="1">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Nilai</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ardanta Ariel</td>
            <td>90</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Ariel Ardanta</td>
            <td>85</td>
        </tr>
    </table>

    <h2>Contoh menggabungkan kolom (colspan)</h2>
    <table border="1">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Nilai</th>
        </tr>
        <tr>
            <td>1</td>
            <td colspan="2">Ariel - Nilai 90</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Sigma</td>
            <td>85</td>
        </tr>
    </table>

    <h2>Contoh menggabungkan baris (rowspan)</h2>
    <table border="1">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Nilai</th>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td>Iqbal Ilmi</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Brownie</td>
            <td>85</td>
        </tr>
    </table>
</body>
</html>
