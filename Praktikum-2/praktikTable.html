<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktek Tabel</title>
  </head>
  <body>
    <h2>Tabel Nilai</h2>
    <table border="1">
      <tr>
        <th>No</th>
        <th>Nama</th>
        <th>Nilai</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Brownie</td>
        <td>90</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Iqbal</td>
        <td>85</td>
      </tr>
    </table>

    <hr>
    <table border="1">
      <tr>
        <th rowspan="2">NO</th>
        <th rowspan="2">Nama</th>
        <th colspan="3">Nilai Mapel</th>
      </tr>
      <tr>
        <th>Mat</th>
        <th>Bindo</th>
        <th>Produktif</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Ilmi</td>
        <td>90</td>
        <td>87</td>
        <td>95</td>
      </tr>
    </table>
  </body>
</html>
